<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Gentle JEV Lab</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 20px;background:#19151b;color:#f8edf5}button{padding:10px 14px;background:#d66b9b;color:white;border:0;border-radius:6px;cursor:pointer}pre{background:#271f29;padding:16px;overflow:auto;border-radius:6px}small{color:#c9aebe}</style></head><body><h1>Gentle JEV Lab</h1><p>Wikiracing-style project navigation with a bounded read-only MCP server.</p><button id="run">Run project summary</button><pre id="out">Waiting…</pre><small>Public synthetic fixture. No credentials, shell execution, writes, or deployment.</small><script>run.onclick=async()=>{const t=performance.now();const r=await fetch('/mcp',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/call',params:{name:'project_summary',arguments:{}}})});out.textContent=JSON.stringify({elapsedMs:Number((performance.now()-t).toFixed(1)),response:await r.json()},null,2)};</script></body></html>
